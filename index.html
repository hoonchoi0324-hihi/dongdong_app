<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>채팅은 똥똥씨~</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 폰 메신저 한 화면. 목록 화면 ↔ 채팅 화면 전환 */
:root{
  --bg:#000000; --panel:#0b0b0b; --fg:#f5f5f5; --muted:#8e8e93; --line:#222224;
  --accent:#ff3b30; --accent-soft:#1f0e0d; --bone:#777777; --mine:#ff3b30; --mine-fg:#fff;
  --theirs:#1c1c1e; --display:"Jua",system-ui,sans-serif; --body:"Gowun Dodum",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{width:100%;max-width:480px;height:100%;margin:0 auto;background:var(--panel);display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
[hidden]{display:none!important}

/* 시작 화면 */
.start{justify-content:center;align-items:center;gap:18px;padding:24px max(20px,env(safe-area-inset-left))}
.start .logo{width:150px}
.start h1{font-family:var(--display);font-size:44px;margin:0;letter-spacing:-1px}
.start p{color:var(--muted);margin:0;text-align:center;line-height:1.6}
.field{width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;color:var(--muted)}
input,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-family:var(--display);font-size:18px;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5}
.err{color:var(--accent);font-size:13px;min-height:18px;text-align:center}
.or{color:var(--muted);font-size:13px}
.tagline{font-family:var(--display);font-size:17px;color:var(--accent);text-align:center;line-height:1.4;margin-top:-8px}
.foot{flex:none;text-align:center;font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}

/* 상단바 */
.top{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));border-bottom:1px solid var(--line)}
.top .logo{width:38px}
.top h2{font-family:var(--display);font-size:24px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
.icon-btn{border:0;background:var(--bg);color:var(--fg);width:40px;height:40px;border-radius:50%;font-size:20px;display:grid;place-items:center;flex:none}

/* 내 코드 카드 */
.mycode{min-width:0;margin:14px 16px 6px;padding:14px 16px;border-radius:18px;background:var(--accent-soft);display:flex;align-items:center;gap:12px}
.mycode .lbl{font-size:12px;color:var(--muted)}
.mycode .code{font-family:var(--display);font-size:28px;letter-spacing:4px;color:var(--accent)}
.mycode .grow{flex:1}
.chip{border:0;border-radius:999px;padding:8px 12px;background:var(--panel);color:var(--fg);font-size:13px}

.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px 16px 12px}
.actions button{min-width:0;word-break:keep-all;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:14px;padding:10px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.actions b{font-size:20px}

.rooms{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
.room{display:flex;gap:12px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:var(--fg)}
.room:hover{background:var(--bg)}
.av{width:48px;height:48px;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;flex:none}
.room .mid{flex:1;min-width:0}
.room .nm{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .last{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .tm{color:var(--muted);font-size:11px;align-self:flex-start;margin-top:4px}
.badge{font-size:11px;color:var(--muted);margin-left:4px;font-family:var(--body)}
.empty{text-align:center;color:var(--muted);padding:40px 24px;line-height:1.7}
.empty .logo{width:80px;opacity:.8;margin-bottom:8px}

/* 채팅 */
.msgs{flex:1;overflow-y:auto;padding:14px max(14px,env(safe-area-inset-left)) 8px max(14px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--panel);padding:4px 12px;border-radius:999px;margin:8px 0}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.row.mine{flex-direction:row-reverse}
.row .av{width:34px;height:34px;border-radius:12px;font-size:14px}
.row.cont .av{visibility:hidden}
.bwrap{display:flex;flex-direction:column;gap:3px;max-width:72%;min-width:0}
.row.mine .bwrap{align-items:flex-end}
.who{font-size:12px;color:var(--muted);margin-left:4px}
.row.cont .who,.row.mine .who{display:none}
.bub{padding:9px 13px;border-radius:18px;background:var(--theirs);line-height:1.5;word-break:break-word;white-space:pre-wrap;border-bottom-left-radius:6px}
.row.mine .bub{background:var(--mine);color:var(--mine-fg);border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.bub.big{background:none!important;font-size:46px;padding:0;line-height:1.1}
.meta{font-size:10px;color:var(--muted);align-self:flex-end;flex:none}
.sys{align-self:center;font-size:12px;color:var(--muted)}

.composer{display:flex;gap:8px;align-items:flex-end;padding:10px max(12px,env(safe-area-inset-left)) 10px max(12px,env(safe-area-inset-right));border-top:1px solid var(--line);background:var(--panel)}
.composer textarea{min-height:42px;max-height:120px;resize:none;font-family:var(--body);font-size:15px;border-radius:21px;padding:10px 14px}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:20px;flex:none}
.stickers{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.stickers button{border:0;background:var(--bg);border-radius:12px;font-size:26px;padding:4px 8px;flex:none}

/* 모달 */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--panel);width:100%;border-radius:24px 24px 0 0;padding:20px max(20px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--display);font-size:22px;margin:0}
.sheet p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.sheet .row2{display:flex;gap:8px}
.sheet .row2 .btn{flex:1}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;white-space:nowrap}
</style>
</head>
<body>
<!--
  ★ 지훈이가 할 일: 아래 FIREBASE_CONFIG에 파이어베이스 웹앱 설정값을 붙여넣기
  (파이어베이스 콘솔 dong 프로젝트 → 프로젝트 설정 → 내 앱 → SDK 설정 및 구성 → 구성)
  databaseURL은 Realtime Database 화면 맨 위 주소(https://...asia-southeast1.firebasedatabase.app)
  비워두면 앱 첫 화면에서 붙여넣을 수 있음.
-->
<script>
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "dong-a8488.firebaseapp.com",
  databaseURL: "https://dong-a8488-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dong-a8488",
  storageBucket: "dong-a8488.firebasestorage.app",
  messagingSenderId: "",
  appId: ""
};
</script>

<svg width="0" height="0" style="position:absolute">
  <symbol id="logo" viewBox="0 0 400 400">
    <rect x="0" y="0" width="400" height="400" rx="40" fill="#fff"/>
    <circle cx="105" cy="140" r="80" fill="#e2e2e2"/>
    <circle cx="295" cy="140" r="80" fill="#e2e2e2"/>
    <circle cx="112" cy="162" r="46" fill="#000"/>
    <circle cx="278" cy="162" r="46" fill="#000"/>
    <circle cx="120" cy="176" r="20" fill="#fff"/>
    <circle cx="275" cy="176" r="20" fill="#fff"/>
    <circle cx="200" cy="218" r="38" fill="#ff3333"/>
    <circle cx="200" cy="218" r="22" fill="#a06464"/>
    <line x1="238" y1="335" x2="350" y2="240" stroke="#777" stroke-width="58" stroke-linecap="round"/>
    <circle cx="235" cy="338" r="44" fill="#777"/>
    <circle cx="350" cy="236" r="44" fill="#777"/>
  </symbol>
</svg>

<div class="app">
  <!-- 설정 화면 -->
  <section class="screen start" id="setup" hidden>
    <svg class="logo" viewBox="0 0 400 400"><use href="#logo"/></svg>
    <h1>똥똥씨</h1>
    <p>파이어베이스 dong 설정이 아직 없어요.<br>콘솔에서 복사한 firebaseConfig를 붙여넣어 주세요.</p>
    <div class="field">
      <textarea id="cfgInput" placeholder='{ apiKey: "...", projectId: "...", ... }'></textarea>
      <button class="btn" id="cfgSave">연결하기</button>
      <div class="err" id="cfgErr"></div>
    </div>
  </section>

  <!-- 가입/로그인 -->
  <section class="screen start" id="login" hidden>
    <svg class="logo" viewBox="0 0 400 400"><use href="#logo"/></svg>
    <h1>똥똥씨</h1>
    <div class="tagline">와이파이가 있어야 채팅되는<br>참 쓸모없는 앱</div>
    <p>내 코드 하나로 친구랑 채팅하고<br>단톡방도 만들 수 있어요</p>
    <div class="field">
      <label for="nickIn">닉네임</label>
      <input id="nickIn" maxlength="12" placeholder="예: 지훈">
      <button class="btn" id="makeBtn">새 코드 만들기</button>
    </div>
    <div class="or">이미 코드가 있다면</div>
    <div class="field">
      <input id="codeIn" maxlength="6" placeholder="내 코드 6자리" style="text-transform:uppercase;letter-spacing:3px">
      <button class="btn ghost" id="loginBtn">내 코드로 들어가기</button>
      <div class="err" id="loginErr"></div>
    </div>
  </section>

  <!-- 채팅 목록 -->
  <section class="screen" id="home" hidden>
    <div class="top">
      <svg class="logo" viewBox="0 0 400 400"><use href="#logo"/></svg>
      <h2>똥똥씨<small id="hello"></small></h2>
      <button class="icon-btn" id="logoutBtn" aria-label="로그아웃" title="로그아웃">⎋</button>
    </div>
    <div class="mycode">
      <div class="grow">
        <div class="lbl">내 코드 · 친구에게 알려주세요</div>
        <div class="code" id="myCode">------</div>
      </div>
      <button class="chip" id="copyCode">복사</button>
    </div>
    <div class="actions">
      <button id="aDm"><b>💬</b>친구 코드로 채팅</button>
      <button id="aGroup"><b>👥</b>단톡방 만들기</button>
      <button id="aJoin"><b>🚪</b>단톡방 들어가기</button>
    </div>
    <div class="rooms" id="rooms"></div>
    <div class="foot">💩 와이파이가 있어야 채팅되는 참 쓸모없는 앱</div>
  </section>

  <!-- 채팅방 -->
  <section class="screen" id="chat" hidden>
    <div class="top">
      <button class="icon-btn" id="backBtn" aria-label="뒤로">‹</button>
      <h2 id="roomTitle">채팅<small id="roomSub"></small></h2>
      <button class="icon-btn" id="roomInfoBtn" aria-label="방 정보">⋯</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="stickers" id="stickers" hidden></div>
    <div class="composer">
      <button class="icon-btn" id="stkBtn" aria-label="이모티콘">😀</button>
      <textarea id="msgIn" rows="1" placeholder="메시지 입력"></textarea>
      <button class="send" id="sendBtn" aria-label="보내기">↑</button>
    </div>
  </section>

  <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const $ = s => document.querySelector(s);
const COLORS = ["#ff3b30","#ff9500","#34c759","#007aff","#af52de","#5ac8fa","#ff2d55","#8e8e93","#a2845e"];
const CODE_CH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const STICKERS = ["💩","😂","👍","❤️","😭","😡","🤣","🙏","🔥","🎮","🍕","👻","🥱","😎","🤔","🎉"];
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };

let db, me = null, curRoom = null, memberNames = {};
let myRoomsRef = null, roomRefs = {}, roomsData = {}, roomRef = null, msgRef = null;

function genCode(n=6){let s="";for(let i=0;i<n;i++)s+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return s}
function show(id){for(const s of ["setup","login","home","chat"])$("#"+s).hidden = s!==id}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;$(".app").appendChild(d);setTimeout(()=>d.remove(),1800)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function colorOf(code){let h=0;for(const c of code||"")h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function initial(n){return (n||"?").trim().charAt(0)||"?"}
function fmtTime(ms){if(!ms)return"";const d=new Date(ms),now=new Date();
  if(d.toDateString()===now.toDateString()){let h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0");return (h<12?"오전 ":"오후 ")+((h%12)||12)+":"+m}
  return (d.getMonth()+1)+"월 "+d.getDate()+"일"}
function fmtDay(ms){const d=new Date(ms);return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+"일월화수목금토"[d.getDay()]+"요일"}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("복사했어요: "+t)}catch(e){toast("코드: "+t)}}
const R = p => db.ref(p);
async function exists(p){return (await R(p).get()).exists()}
function memberList(r){return Object.keys((r&&r.members)||{})}

/* ---------- 파이어베이스 시작 ---------- */
function getConfig(){
  if(FIREBASE_CONFIG.databaseURL) return FIREBASE_CONFIG;
  const saved = ls.get("dd_cfg"); if(saved){try{return JSON.parse(saved)}catch(e){}}
  return null;
}
function parseCfg(txt){
  const m = txt.match(/\{[\s\S]*\}/); if(!m) throw 0;
  const json = m[0].replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,"}");
  const o = JSON.parse(json); if(!o.apiKey) throw 0;
  if(!o.databaseURL && o.projectId) o.databaseURL = "https://"+o.projectId+"-default-rtdb.asia-southeast1.firebasedatabase.app";
  return o;
}
function boot(){
  const cfg = getConfig();
  if(!cfg){show("setup");return}
  try{ firebase.initializeApp(cfg); db = firebase.database(); }
  catch(e){ show("setup"); $("#cfgErr").textContent="설정값을 다시 확인해 주세요"; return }
  const code = ls.get("dd_me");
  if(code) login(code,true); else show("login");
}
$("#cfgSave").onclick = ()=>{
  try{ const o = parseCfg($("#cfgInput").value); ls.set("dd_cfg",JSON.stringify(o)); location.reload(); }
  catch(e){ $("#cfgErr").textContent="firebaseConfig 내용을 그대로 붙여넣어 주세요"; }
};

/* ---------- 가입 / 로그인 ---------- */
$("#makeBtn").onclick = async ()=>{
  const name = $("#nickIn").value.trim();
  if(!name){$("#loginErr").textContent="닉네임을 먼저 적어 주세요";return}
  $("#makeBtn").disabled=true;
  try{
    let code;
    for(let i=0;i<8;i++){ code=genCode(); if(!(await exists("users/"+code))) break; }
    await R("users/"+code).set({name, createdAt:Date.now()});
    ls.set("dd_me",code); await login(code);
  }catch(e){ $("#loginErr").textContent="연결 실패: 데이터베이스 규칙을 확인해 주세요"; console.error(e) }
  $("#makeBtn").disabled=false;
};
$("#loginBtn").onclick = ()=>{
  const c = $("#codeIn").value.trim().toUpperCase();
  if(c.length!==6){$("#loginErr").textContent="코드는 6자리예요";return}
  login(c);
};
async function login(code, silent){
  try{
    const s = await R("users/"+code).get();
    if(!s.exists()){ ls.del("dd_me"); show("login"); if(!silent)$("#loginErr").textContent="없는 코드예요"; return }
    me = {code, name:s.val().name}; ls.set("dd_me",code);
    $("#myCode").textContent=code; $("#hello").textContent=me.name+"님";
    show("home"); listenRooms();
  }catch(e){ show("login"); $("#loginErr").textContent="연결 실패: 데이터베이스 규칙을 확인해 주세요"; console.error(e) }
}
$("#logoutBtn").onclick = ()=>openSheet(`
  <h3>로그아웃할까요?</h3><p>내 코드 <b>${me.code}</b>를 기억해 두면 다른 기기에서도 그대로 들어올 수 있어요.</p>
  <div class="row2"><button class="btn ghost" data-close>취소</button><button class="btn" id="doOut">로그아웃</button></div>`,
  ()=>{$("#doOut").onclick=()=>{ls.del("dd_me");location.reload()}});
$("#copyCode").onclick = ()=>copy(me.code);

/* ---------- 채팅방 목록 ---------- */
function listenRooms(){
  myRoomsRef = R("userRooms/"+me.code);
  myRoomsRef.on("value", snap=>{
    const ids = Object.keys(snap.val()||{});
    for(const id of Object.keys(roomRefs)) if(!ids.includes(id)){ roomRefs[id].off(); delete roomRefs[id]; delete roomsData[id]; }
    for(const id of ids) if(!roomRefs[id]){
      roomRefs[id] = R("rooms/"+id);
      roomRefs[id].on("value", s=>{ if(s.exists()) roomsData[id]={id,...s.val()}; else delete roomsData[id]; drawRooms(); });
    }
    drawRooms();
  }, e=>{console.error(e);toast("목록을 못 불러왔어요")});
}
function drawRooms(){
  const list = Object.values(roomsData).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
  const box = $("#rooms");
  if(!list.length){ box.innerHTML = `<div class="empty"><svg class="logo" viewBox="0 0 400 400"><use href="#logo"/></svg><br>아직 채팅방이 없어요.<br>친구 코드를 넣어서 첫 채팅을 시작해 보세요.</div>`; return }
  box.innerHTML = list.map(r=>{
    const title = roomTitle(r);
    return `<button class="room" data-id="${r.id}">
      <div class="av" style="background:${r.isGroup?"#777":colorOf(otherCode(r))}">${r.isGroup?"👥":esc(initial(title))}</div>
      <div class="mid"><div class="nm">${esc(title)}${r.isGroup?`<span class="badge">${memberList(r).length}</span>`:""}</div>
      <div class="last">${esc(r.lastMsg||"대화를 시작해 보세요")}</div></div>
      <div class="tm">${fmtTime(r.lastAt)}</div></button>`}).join("");
  box.querySelectorAll(".room").forEach(b=>b.onclick=()=>openRoom(b.dataset.id));
}
function otherCode(r){return memberList(r).find(c=>c!==me.code)||me.code}
function roomTitle(r){
  if(r.isGroup) return r.name||"단톡방";
  const o = otherCode(r); return (r.names&&r.names[o])||o;
}
async function addMember(id, code, name){
  await R().update({["rooms/"+id+"/members/"+code]:true, ["rooms/"+id+"/names/"+code]:name, ["userRooms/"+code+"/"+id]:true});
}
function sysMsg(id,text){return R("messages/"+id).push({sys:true,text,at:Date.now()})}

/* ---------- 1:1 / 단톡방 만들기 ---------- */
$("#aDm").onclick = ()=>openSheet(`
  <h3>친구 코드로 채팅</h3><p>친구의 6자리 코드를 입력하면 1:1 채팅방이 열려요.</p>
  <input id="fCode" maxlength="6" placeholder="친구 코드" style="text-transform:uppercase;letter-spacing:3px">
  <div class="err" id="fErr"></div>
  <div class="row2"><button class="btn ghost" data-close>취소</button><button class="btn" id="fGo">채팅 시작</button></div>`,
  ()=>{ $("#fCode").focus(); $("#fGo").onclick = async ()=>{
    const c=$("#fCode").value.trim().toUpperCase();
    if(c===me.code){$("#fErr").textContent="내 코드예요 😅";return}
    const s=await R("users/"+c).get();
    if(!s.exists()){$("#fErr").textContent="그런 코드는 없어요";return}
    const id="dm_"+[me.code,c].sort().join("_");
    if(!(await exists("rooms/"+id))){
      await R().update({
        ["rooms/"+id]:{isGroup:false,members:{[me.code]:true,[c]:true},names:{[me.code]:me.name,[c]:s.val().name},lastMsg:"",lastAt:Date.now()},
        ["userRooms/"+me.code+"/"+id]:true, ["userRooms/"+c+"/"+id]:true });
    }
    closeSheet(); openRoom(id);
  }});

$("#aGroup").onclick = ()=>openSheet(`
  <h3>단톡방 만들기</h3><p>방 이름과 초대할 친구 코드를 적어 주세요. 친구 코드는 띄어쓰기나 쉼표로 여러 개 넣을 수 있어요. 비워 두고 나중에 방 코드를 알려줘도 돼요.</p>
  <input id="gName" maxlength="20" placeholder="방 이름 (예: 우리반 게임단)">
  <input id="gCodes" placeholder="친구 코드들 (선택)" style="text-transform:uppercase">
  <div class="err" id="gErr"></div>
  <div class="row2"><button class="btn ghost" data-close>취소</button><button class="btn" id="gGo">만들기</button></div>`,
  ()=>{ $("#gName").focus(); $("#gGo").onclick = async ()=>{
    const name=$("#gName").value.trim(); if(!name){$("#gErr").textContent="방 이름을 적어 주세요";return}
    const codes=[...new Set($("#gCodes").value.toUpperCase().split(/[\s,]+/).filter(Boolean))].filter(c=>c!==me.code);
    const names={[me.code]:me.name}, members={[me.code]:true}, bad=[];
    for(const c of codes){const s=await R("users/"+c).get(); if(s.exists()){members[c]=true;names[c]=s.val().name}else bad.push(c)}
    if(bad.length){$("#gErr").textContent="없는 코드: "+bad.join(", ");return}
    let id; for(let i=0;i<8;i++){id="G"+genCode(5); if(!(await exists("rooms/"+id)))break}
    const up={["rooms/"+id]:{isGroup:true,name,owner:me.code,members,names,lastMsg:me.name+"님이 방을 만들었어요",lastAt:Date.now()}};
    for(const c of Object.keys(members)) up["userRooms/"+c+"/"+id]=true;
    await R().update(up);
    await sysMsg(id, me.name+"님이 단톡방을 만들었어요. 방 코드: "+id);
    closeSheet(); openRoom(id);
  }});

$("#aJoin").onclick = ()=>openSheet(`
  <h3>단톡방 들어가기</h3><p>친구에게 받은 단톡방 코드(G로 시작하는 6자리)를 넣어 주세요.</p>
  <input id="jCode" maxlength="6" placeholder="예: G7KQ2M" style="text-transform:uppercase;letter-spacing:3px">
  <div class="err" id="jErr"></div>
  <div class="row2"><button class="btn ghost" data-close>취소</button><button class="btn" id="jGo">들어가기</button></div>`,
  ()=>{ $("#jCode").focus(); $("#jGo").onclick = async ()=>{
    const id=$("#jCode").value.trim().toUpperCase();
    const s = /^G[A-Z0-9]{5}$/.test(id) ? await R("rooms/"+id).get() : null;
    if(!s||!s.exists()||!s.val().isGroup){$("#jErr").textContent="그런 단톡방은 없어요";return}
    if(!(s.val().members||{})[me.code]){
      await addMember(id, me.code, me.name);
      await R("rooms/"+id).update({lastMsg:me.name+"님이 들어왔어요",lastAt:Date.now()});
      await sysMsg(id, me.name+"님이 들어왔어요");
    }
    closeSheet(); openRoom(id);
  }});

/* ---------- 채팅방 ---------- */
function stopRoom(){ if(roomRef)roomRef.off(); if(msgRef)msgRef.off(); roomRef=msgRef=null; }
function openRoom(id){
  stopRoom(); show("chat"); $("#msgs").innerHTML=""; curRoom={id};
  roomRef = R("rooms/"+id);
  roomRef.on("value", s=>{
    if(!s.exists())return; curRoom={id,...s.val()}; memberNames=curRoom.names||{};
    $("#roomTitle").firstChild.textContent = roomTitle(curRoom);
    $("#roomSub").textContent = curRoom.isGroup ? `${memberList(curRoom).length}명 · 방 코드 ${id}` : "코드 "+otherCode(curRoom);
  });
  msgRef = R("messages/"+id).orderByChild("at").limitToLast(300);
  msgRef.on("value", snap=>{
    const list=[]; snap.forEach(c=>{list.push(c.val())});
    renderMsgs(list);
  }, e=>{console.error(e);toast("메시지를 못 불러왔어요")});
  setTimeout(()=>$("#msgIn").focus(),50);
}
function renderMsgs(list){
  const box=$("#msgs"); const atBottom = box.scrollHeight-box.scrollTop-box.clientHeight<80;
  let html="", prevFrom=null, prevDay=null;
  list.forEach((m,i)=>{
    const day=new Date(m.at).toDateString();
    if(day!==prevDay){html+=`<div class="day">${fmtDay(m.at)}</div>`;prevDay=day;prevFrom=null}
    if(m.sys){html+=`<div class="sys">${esc(m.text)}</div>`;prevFrom=null;return}
    const mine=m.from===me.code, cont=prevFrom===m.from;
    const next=list[i+1]; const showTime=!next||next.from!==m.from||fmtTime(next.at)!==fmtTime(m.at);
    const name=memberNames[m.from]||m.name||m.from;
    const big=/^\p{Extended_Pictographic}$/u.test(m.text);
    html+=`<div class="row ${mine?"mine":""} ${cont?"cont":""}">
      ${mine?"":`<div class="av" style="background:${colorOf(m.from)}">${esc(initial(name))}</div>`}
      <div class="bwrap">${mine?"":`<div class="who">${esc(name)}</div>`}<div class="bub ${big?"big":""}">${esc(m.text)}</div></div>
      ${showTime?`<div class="meta">${fmtTime(m.at)}</div>`:""}</div>`;
    prevFrom=m.from;
  });
  if(!list.length) html=`<div class="sys">첫 메시지를 보내 보세요 💩</div>`;
  box.innerHTML=html;
  if(atBottom||list.length&&list[list.length-1].from===me.code) box.scrollTop=box.scrollHeight;
}
async function send(text){
  text=(text||"").trim().slice(0,1000); if(!text||!curRoom)return;
  const at=Date.now();
  try{
    await R("messages/"+curRoom.id).push({from:me.code,name:me.name,text,at});
    await R("rooms/"+curRoom.id).update({lastMsg:(curRoom.isGroup?me.name+": ":"")+text.slice(0,60),lastAt:at});
  }catch(e){console.error(e);toast("못 보냈어요. 인터넷을 확인해 주세요")}
}
$("#sendBtn").onclick=()=>{const t=$("#msgIn").value;$("#msgIn").value="";autoGrow();send(t);$("#msgIn").focus()};
$("#msgIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("#sendBtn").click()}});
function autoGrow(){const t=$("#msgIn");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,120)+"px"}
$("#msgIn").addEventListener("input",autoGrow);
$("#stickers").innerHTML=STICKERS.map(s=>`<button>${s}</button>`).join("");
$("#stickers").querySelectorAll("button").forEach(b=>b.onclick=()=>send(b.textContent));
$("#stkBtn").onclick=()=>$("#stickers").hidden=!$("#stickers").hidden;
$("#backBtn").onclick=()=>{stopRoom();curRoom=null;show("home")};
$("#roomInfoBtn").onclick=()=>{
  if(!curRoom)return;
  const people=memberList(curRoom).map(c=>`<div style="display:flex;gap:10px;align-items:center"><div class="av" style="width:32px;height:32px;border-radius:11px;font-size:14px;background:${colorOf(c)}">${esc(initial(memberNames[c]||c))}</div><div>${esc(memberNames[c]||c)} <span style="color:var(--muted);font-size:12px">${c}${c===me.code?" · 나":""}</span></div></div>`).join("");
  openSheet(`<h3>${esc(roomTitle(curRoom))}</h3>
    ${curRoom.isGroup?`<p>친구에게 방 코드 <b>${curRoom.id}</b>를 알려주면 들어올 수 있어요.</p>`:""}
    <div style="display:flex;flex-direction:column;gap:8px;max-height:40vh;overflow-y:auto">${people}</div>
    <div class="row2">${curRoom.isGroup?`<button class="btn ghost" id="cpRoom">방 코드 복사</button><button class="btn" id="leave">나가기</button>`:`<button class="btn ghost" data-close>닫기</button>`}</div>`,
    ()=>{ if(!curRoom.isGroup)return;
      $("#cpRoom").onclick=()=>copy(curRoom.id);
      $("#leave").onclick=async()=>{const id=curRoom.id;
        await sysMsg(id, me.name+"님이 나갔어요");
        await R().update({["rooms/"+id+"/members/"+me.code]:null,["userRooms/"+me.code+"/"+id]:null,["rooms/"+id+"/lastMsg"]:me.name+"님이 나갔어요",["rooms/"+id+"/lastAt"]:Date.now()});
        closeSheet();$("#backBtn").click()};
    });
};

/* ---------- 시트 ---------- */
function openSheet(html,after){$("#sheet").innerHTML=html;$("#modal").hidden=false;$("#sheet").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);after&&after()}
function closeSheet(){$("#modal").hidden=true}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeSheet()};

boot();
</script>
</body>
</html>
